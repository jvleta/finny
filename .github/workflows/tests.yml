name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MPLCONFIGDIR: ${{ runner.temp }}/mplconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage

      - name: Run unit tests
        run: |
          python -m unittest test_black_scholes_solver.py test_american_black_scholes_solver.py test_dividend_black_scholes_solver.py
